services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: savepass
      POSTGRES_USER: savepass_user
      POSTGRES_PASSWORD: savepass_password
    ports:
      # Only this machine; 5436 because 5432 is a native PostgreSQL service,
      # 5433/5434 are Savings Tool and 5435 is the installed Save-Pass (task 36).
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepass_user -d savepass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://savepass_user:savepass_password@db:5432/savepass
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Apply migrations, then serve (task 31.6).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
