# Production stack (task 32.6).
#
#   cp .env.prod.example .env.prod   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy is published (80/443). PostgreSQL and the API stay on the
# internal network. Migrations run as the database owner in the one-shot
# "migrate" service; the API connects as the least-privilege app_user role.

# Email settings shared by the API and the reminder scheduler (spec Phase 2).
x-email-env: &email-env
  DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@db:5432/savepass
  EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
  APP_BASE_URL: https://${SITE_ADDRESS:-localhost}
  VERIFICATION_TOKEN_HOURS: ${VERIFICATION_TOKEN_HOURS:-48}
  VERIFICATION_REMINDER_DAYS: ${VERIFICATION_REMINDER_DAYS:-7,1}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: savepass
      POSTGRES_USER: savepass_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-app-user.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savepass_owner -d savepass"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Scheduled pg_dump backups into the "backups" volume (task 34.3).
  # Copy them off the server: docker compose ... cp backup:/backups ./offsite
  # Restore: ./scripts/restore-backup.sh <dump>
  backup:
    image: postgres:15
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: savepass_owner
      PGDATABASE: savepass
      PGPASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

  # Shared rate-limit counters for every API worker (task 34.2). Counters are
  # short-lived, so nothing is persisted to disk.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://savepass_owner:${DB_OWNER_PASSWORD}@db:5432/savepass
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "15"
      REFRESH_EXPIRE_HOURS: ${REFRESH_EXPIRE_HOURS:-8}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      # Frontend and API share Caddy's origin; CORS is only a safety net.
      CORS_ORIGINS: https://${SITE_ADDRESS:-localhost}
      RATE_LIMIT_ENABLED: "true"
      # Counters shared by all workers through Redis (task 34.2).
      RATE_LIMIT_STORAGE: ${RATE_LIMIT_STORAGE:-redis://redis:6379/0}
      RATE_LIMIT_FALLBACK: ${RATE_LIMIT_FALLBACK:-60/minute}
      # uvicorn worker processes (read by uvicorn as its --workers default).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Spec Phase 2 (task 33): off unless set in .env.prod.
      <<: *email-env
      HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Hourly: emails verification reminders 7 and 1 days before the deadline
  # (task 34.4). Idempotent; does nothing while email verification is off.
  scheduler:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *email-env
    command:
      - sh
      - -c
      - while true; do python -m app.cli send-verification-reminders || true; sleep 3600; done
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backups:
  caddy_data:
  caddy_config:
