# Continuous integration (task 32.2).
# Runners are pinned: ubuntu-latest moved to Ubuntu 26, which
# "playwright install --with-deps" does not support yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, audit, tests on SQLite + PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savepass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.8.4 pip-audit==2.7.3
      - name: Lint (ruff)
        run: ruff check .
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Tests (SQLite)
        run: pytest tests/ -q
      - name: Migrations on PostgreSQL (upgrade, drift check, downgrade)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/savepass_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: API tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/savepass_test
        run: pytest tests/test_mvp_contract.py tests/test_security_hardening.py tests/test_key_rotation.py -q

  frontend:
    name: Frontend (lint, types, unit tests, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests (Vitest)
        run: npx vitest --run
      - name: Build
        run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright on PostgreSQL)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savepass_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright
        working-directory: frontend
        env:
          E2E_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/savepass_e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  production:
    name: Production stack smoke test (Docker, Caddy, app_user)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test docker-compose.prod.yml
        run: ./scripts/smoke-prod.sh
