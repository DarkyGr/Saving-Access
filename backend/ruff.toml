# Backend lint configuration (task 32.1). Run: ruff check .
target-version = "py311"
line-length = 100
extend-exclude = ["migrations/versions"]

[lint]
# pycodestyle errors/warnings, pyflakes, bugbear, pyupgrade, datetime timezone checks
select = ["E", "W", "F", "B", "UP", "DTZ"]
ignore = [
  "E501",   # long lines: docstrings/SQL; formatting is not enforced yet
  "B008",   # FastAPI's Depends()/Cookie() in defaults is the documented pattern
]

[lint.per-file-ignores]
"tests/*" = ["DTZ", "E402"]   # env vars must be set before importing the app
"app/main.py" = ["E402"]      # routers imported after app creation
